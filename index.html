<!--
Clothing Brand — Full Dynamic Single-File Website
Features:
- Single HTML file with embedded CSS and JS
- Dynamic product rendering from in-file JSON
- Search, filter (category), sort, price range
- Product detail modal
- Cart with localStorage persistence
- Responsive layout
- Easy to adapt to real backend/API

How to use:
1. Save this file as `index.html` and open in a browser.
2. Replace sample product data with your own or fetch from an API.
3. To connect to a backend, replace `PRODUCTS` constant with a fetch() to your API.

Notes:
- This is a front-end-only demo. For multi-user carts, orders, accounts -> add a backend (Node/Express, Django, etc.)
- Images use picsum placeholders. Replace with real images or a CDN.
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Apparel — Demo Store</title>
    <style>
      :root {
        --bg: #f7f7f9;
        --card: #ffffff;
        --accent: #1f6feb;
        --muted: #6b7280;
        --success: #16a34a;
        --max-w: 1200px;
        --radius: 12px;
        --gap: 16px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #111;
      }
      .container {
        max-width: var(--max-w);
        margin: 24px auto;
        padding: 20px;
      }

      /* Header */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .logo {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .tools {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .search {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #e6e6ef;
        background: white;
        min-width: 200px;
      }
      .icon-btn {
        background: var(--card);
        border: 1px solid #e6e6ef;
        padding: 8px;
        border-radius: 10px;
        cursor: pointer;
      }

      /* Layout */
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 18px;
      }

      /* Sidebar */
      .sidebar {
        background: var(--card);
        padding: 16px;
        border-radius: var(--radius);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }
      .section {
        margin-bottom: 18px;
      }
      .section h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
      }
      .categories button {
        display: block;
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .categories button.active {
        background: #eef2ff;
        border-color: #dbeafe;
      }
      .price-range {
        display: flex;
        gap: 8px;
      }
      input[type="range"] {
        width: 100%;
      }

      /* Product grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 4px 18px rgba(12, 15, 20, 0.04);
        display: flex;
        flex-direction: column;
      }
      .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
      }
      .card .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }
      .price {
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .btn {
        padding: 8px 10px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      .secondary {
        background: transparent;
        border: 1px solid #e6e6ef;
        color: inherit;
      }

      /* Cart */
      .cart-btn {
        position: relative;
      }
      .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--success);
        color: white;
        border-radius: 999px;
        padding: 3px 6px;
        font-size: 12px;
      }

      /* Cart drawer */
      .drawer {
        position: fixed;
        right: 18px;
        top: 80px;
        width: 360px;
        background: var(--card);
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(8, 12, 20, 0.12);
        max-height: 70vh;
        overflow: auto;
      }
      .drawer h3 {
        margin: 0 0 12px 0;
      }
      .cart-item {
        display: flex;
        gap: 10px;
        align-items: center;
        border-bottom: 1px dashed #eef0f6;
        padding: 10px 0;
      }
      .cart-item img {
        width: 68px;
        height: 68px;
        object-fit: cover;
        border-radius: 8px;
      }
      .qty {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal {
        background: var(--card);
        padding: 18px;
        border-radius: 12px;
        max-width: 920px;
        width: 95%;
        display: flex;
        gap: 18px;
      }
      .modal img {
        width: 48%;
        height: 420px;
        object-fit: cover;
        border-radius: 10px;
      }
      .modal .info {
        width: 52%;
      }

      /* Footer */
      footer {
        margin-top: 22px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          order: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">CW</div>
          <div>
            <h1>Cart World</h1>
            <div class="muted">The cart starts here</div>
          </div>
        </div>
        <div class="tools">
          <input
            id="searchInput"
            class="search"
            placeholder="Search products, e.g. 'jacket'"
          />
          <button id="cartToggle" class="icon-btn cart-btn">
            Cart
            <span id="cartCount" class="badge" style="display: none">0</span>
          </button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="section">
            <h3>Filters</h3>
            <div class="categories" id="categoryList"></div>
          </div>
          <div class="section">
            <h3>Price (max)</h3>
            <div class="price-range">
              <input
                id="priceRange"
                type="range"
                min="0"
                max="300"
                step="1"
                value="300"
              />
              <div id="priceMax">₹300</div>
            </div>
          </div>
          <div class="section">
            <h3>Sort</h3>
            <select
              id="sortSelect"
              style="
                width: 100%;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid #e6e6ef;
              "
            >
              <option value="popular">Most popular</option>
              <option value="price-asc">Price: Low → High</option>
              <option value="price-desc">Price: High → Low</option>
              <option value="new">Newest</option>
            </select>
          </div>
        </aside>

        <section>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            "
          >
            <div class="muted" id="resultsInfo">Showing products</div>
            <div>
              <button id="clearFilters" class="icon-btn secondary">
                Clear
              </button>
            </div>
          </div>

          <div class="grid" id="productGrid"></div>
        </section>
      </main>

      <footer>
        <div style="margin-top: 8px; font-size: 12px; color: #888">
          Made with ❤️ by Vinayak
        </div>
        built with HTML/CSS/JS
      </footer>
    </div>

    <!-- Cart Drawer & Modal container -->
    <div id="drawerArea"></div>
    <div id="modalArea"></div>

    <script>
      /*********************
       * Sample product data
       * Replace or fetch from an API
       *********************/
      const PRODUCTS = [
        {
          id: 1,
          title: "Nicobar Classicc Men T-Shirts",
          slug: "white-tee",
          price: 699,
          category: "T-Shirts",
          rating: 4.6,
          featured: true,
          image:
            "https://www.nicobar.com/cdn/shop/files/NBI033029_3.jpg?v=1709801348",
          description: "Soft cotton tee — perfect everyday basic.",
        },
        {
          id: 2,
          title: "Denim Jacket",
          slug: "denim-jacket",
          price: 2999,
          category: "Jackets",
          rating: 4.8,
          featured: true,
          image:
            "https://images-cdn.ubuy.co.in/66bbb687c17df141bf68d3c6-lzler-casual-jean-jacket-for-men-ripped.jpg",
          description: "Rugged denim jacket with relaxed fit.",
        },
        {
          id: 3,
          title: "Slim Chinos",
          slug: "slim-chinos",
          price: 1599,
          category: "Bottoms",
          rating: 4.5,
          featured: false,
          image:
            "https://pantproject.com/cdn/shop/files/DSC0489_687b1772-ae11-45b5-813d-cb10b65363fc.jpg?v=1755542817",
          description: "Versatile chinos for smart-casual wear.",
        },
        {
          id: 4,
          title: "Athletic Hoodie",
          slug: "ath-hoodie",
          price: 1299,
          category: "Hoodies",
          rating: 4.3,
          featured: false,
          image:
            "https://assets.ajio.com/medias/sys_master/root/20240423/8Qh2/6627c8d605ac7d77bb213f07/-473Wx593H-410409897-98t-MODEL.jpg",
          description: "Warm, breathable hoodie for workouts.",
        },
        {
          id: 5,
          title: "Stripe Polo",
          slug: "stripe-polo",
          price: 899,
          category: "T-Shirts",
          rating: 4.1,
          featured: false,
          image:
            "https://imagescdn.louisphilippe.com/img/app/product/3/39720632-14931593.jpg?auto=format&w=390",
          description: "Smart striped polo — office weekend hybrid.",
        },
        {
          id: 6,
          title: "Cargo Shorts",
          slug: "cargo-shorts",
          price: 799,
          category: "Bottoms",
          rating: 4.0,
          featured: false,
          image:
            "https://assets.myntassets.com/w_412,q_30,dpr_3,fl_progressive,f_webp/assets/images/2025/APRIL/24/dBt4usqQ_528b5e2ea88a4cca98bd7f7d9a29f569.jpg",
          description: "Utility shorts with multiple pockets.",
        },
        {
          id: 7,
          title: "Wool Overcoat",
          slug: "wool-overcoat",
          price: 4999,
          category: "Coats",
          rating: 4.9,
          featured: true,
          image:
            "https://assets.myntassets.com/w_412,q_30,dpr_3,fl_progressive,f_webp/assets/images/2024/NOVEMBER/27/aokKFNeK_554582fb48c240be84619fd34d53b462.jpg",
          description: "Premium wool overcoat for colder months.",
        },
        {
          id: 8,
          title: "Graphic Tee",
          slug: "graphic-tee",
          price: 749,
          category: "T-Shirts",
          rating: 4.2,
          featured: false,
          image:
            "https://www.only.in/cdn/shop/files/900749701_g0.jpg?v=1745910341&width=2048",
          description: "Bold graphic tee for streetwear looks.",
        },
      ];

      /* app state */
      const state = {
        products: PRODUCTS.slice(),
        category: "All",
        priceMax: 300,
        search: "",
        sort: "popular",
        cart: JSON.parse(localStorage.getItem("aa_cart") || "{}"),
      };

      /* helpers */
      const $ = (id) => document.getElementById(id);

      function saveCart() {
        localStorage.setItem("aa_cart", JSON.stringify(state.cart));
        renderCartCount();
      }

      function renderCartCount() {
        const count = Object.values(state.cart).reduce((s, i) => s + i.qty, 0);
        const el = $("cartCount");
        if (count > 0) {
          el.style.display = "inline-block";
          el.textContent = count;
        } else el.style.display = "none";
      }

      // populate categories dynamically
      function renderCategories() {
        const cats = ["All", ...new Set(state.products.map((p) => p.category))];
        const container = $("categoryList");
        container.innerHTML = "";
        cats.forEach((cat) => {
          const btn = document.createElement("button");
          btn.textContent = cat;
          if (cat === state.category) btn.classList.add("active");
          btn.onclick = () => {
            state.category = cat;
            render();
          };
          container.appendChild(btn);
        });
      }

      function applyFilters() {
        let list = state.products.slice();
        if (state.search) {
          const q = state.search.toLowerCase();
          list = list.filter(
            (p) =>
              p.title.toLowerCase().includes(q) ||
              p.description.toLowerCase().includes(q) ||
              p.category.toLowerCase().includes(q)
          );
        }
        if (state.category !== "All")
          list = list.filter((p) => p.category === state.category);
        list = list.filter((p) => p.price <= state.priceMax);

        // sort
        if (state.sort === "price-asc") list.sort((a, b) => a.price - b.price);
        else if (state.sort === "price-desc")
          list.sort((a, b) => b.price - a.price);
        else if (state.sort === "new") list.sort((a, b) => b.id - a.id);
        else list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

        return list;
      }

      function renderProducts() {
        const grid = $("productGrid");
        grid.innerHTML = "";
        const list = applyFilters();
        $("resultsInfo").textContent = `Showing ${list.length} product${
          list.length !== 1 ? "s" : ""
        }`;
        list.forEach((p) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
          <img src="${p.image}" alt="${p.title}" loading="lazy" />
          <div style=\"display:flex;justify-content:space-between;align-items:center\"> 
            <div>
              <div style=\"font-weight:700\">${p.title}</div>
              <div class=\"muted\">${p.category} • ${p.rating}★</div>
            </div>
            <div class=\"price\">₹${p.price}</div>
          </div>
          <div style=\"margin-top:10px;display:flex;gap:8px\">
            <button class=\"btn\" data-id=\"${p.id}\">Add</button>
            <button class=\"icon-btn secondary\" data-view=\"${p.id}\">View</button>
          </div>
        `;
          grid.appendChild(card);
        });

        // attach handlers
        grid.querySelectorAll("[data-id]").forEach((b) =>
          b.addEventListener("click", (e) => {
            const id = Number(e.currentTarget.dataset.id);
            addToCart(id, 1);
          })
        );
        grid.querySelectorAll("[data-view]").forEach((b) =>
          b.addEventListener("click", (e) => {
            const id = Number(e.currentTarget.dataset.view);
            openProductModal(id);
          })
        );
      }

      function addToCart(id, qty = 1) {
        const prod = state.products.find((p) => p.id === id);
        if (!prod) return;
        if (!state.cart[id])
          state.cart[id] = {
            id: prod.id,
            title: prod.title,
            price: prod.price,
            qty: 0,
            image: prod.image,
          };
        state.cart[id].qty += qty;
        saveCart();
        openCartDrawer();
      }

      function updateCartItem(id, qty) {
        if (!state.cart[id]) return;
        if (qty <= 0) {
          delete state.cart[id];
        } else state.cart[id].qty = qty;
        saveCart();
        renderCartDrawer();
      }

      function renderCartDrawer() {
        const container = $("drawerArea");
        const items = Object.values(state.cart);
        if (items.length === 0) {
          container.innerHTML = "";
          return;
        }
        let html = `<div class="drawer"><h3>Your Cart (${items.length})</h3>`;
        items.forEach((it) => {
          html += `
          <div class="cart-item">
            <img src="${it.image}" alt="${it.title}" />
            <div style="flex:1">
              <div style="font-weight:700">${it.title}</div>
              <div class="muted">₹${it.price} each</div>
              <div class="qty" style="margin-top:8px">
                <button class="icon-btn" data-decr="${it.id}">-</button>
                <div>${it.qty}</div>
                <button class="icon-btn" data-incr="${it.id}">+</button>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:700">₹${it.qty * it.price}</div>
            </div>
          </div>
        `;
        });
        const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
        html += `<div style="margin-top:12px;text-align:right;font-weight:700">Subtotal: ₹${subtotal}</div>`;
        html += `<div style="display:flex;gap:8px;margin-top:12px"><button id="checkoutBtn" class="btn">Checkout</button><button id="closeDrawer" class="icon-btn secondary">Close</button></div>`;
        html += `</div>`;
        container.innerHTML = html;

        // attach handlers
        container.querySelectorAll("[data-incr]").forEach((b) =>
          b.addEventListener("click", (e) => {
            const id = Number(e.currentTarget.dataset.incr);
            updateCartItem(id, state.cart[id].qty + 1);
          })
        );
        container.querySelectorAll("[data-decr]").forEach((b) =>
          b.addEventListener("click", (e) => {
            const id = Number(e.currentTarget.dataset.decr);
            updateCartItem(id, state.cart[id].qty - 1);
          })
        );
        $("closeDrawer").onclick = () => {
          container.innerHTML = "";
        };
        $("checkoutBtn").onclick = () => {
          simulateCheckout();
        };
      }

      function openCartDrawer() {
        renderCartDrawer();
        window.scrollTo(0, 0);
      }

      function openProductModal(id) {
        const p = state.products.find((x) => x.id === id);
        if (!p) return;
        const area = $("modalArea");
        area.innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop">
          <div class="modal">
            <img src="${p.image}" alt="${p.title}" />
            <div class="info">
              <h2>${p.title} — ₹${p.price}</h2>
              <div class="muted">${p.category} • ${p.rating}★</div>
              <p style="margin-top:12px">${p.description}</p>
              <div style="margin-top:14px;display:flex;gap:8px">
                <button id="modalAdd" class="btn">Add to cart</button>
                <button id="modalClose" class="icon-btn secondary">Close</button>
              </div>
            </div>
          </div>
        </div>
      `;
        $("modalBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "modalBackdrop") area.innerHTML = "";
        });
        $("modalClose").onclick = () => (area.innerHTML = "");
        $("modalAdd").onclick = () => {
          addToCart(p.id, 1);
          area.innerHTML = "";
        };
      }

      function simulateCheckout() {
        const items = Object.values(state.cart);
        if (items.length === 0) {
          alert("Your cart is empty");
          return;
        }
        // simulate simple checkout
        const total = items.reduce((s, i) => s + i.qty * i.price, 0);
        alert(
          `Thanks! Order placed. Total ₹${total}. (Demo only — no real payment)`
        );
        state.cart = {};
        saveCart();
        $("drawerArea").innerHTML = "";
      }

      /* UI wiring */
      window.addEventListener("load", () => {
        // init controls
        $("priceRange").max = Math.max(
          ...state.products.map((p) => p.price),
          300
        );
        $("priceRange").value = $("priceRange").max;
        state.priceMax = Number($("priceRange").value);
        $("priceMax").textContent = `₹${state.priceMax}`;

        renderCategories();
        renderProducts();
        renderCartCount();

        $("searchInput").addEventListener("input", (e) => {
          state.search = e.target.value;
          render();
        });
        $("priceRange").addEventListener("input", (e) => {
          state.priceMax = Number(e.target.value);
          $("priceMax").textContent = `₹${state.priceMax}`;
          render();
        });
        $("sortSelect").addEventListener("change", (e) => {
          state.sort = e.target.value;
          render();
        });
        $("clearFilters").addEventListener("click", () => {
          state.search = "";
          state.category = "All";
          state.sort = "popular";
          state.priceMax = Number($("priceRange").max);
          $("searchInput").value = "";
          $("sortSelect").value = "popular";
          $("priceRange").value = $("priceRange").max;
          $("priceMax").textContent = `₹${state.priceMax}`;
          render();
        });
        $("cartToggle").addEventListener("click", () => {
          openCartDrawer();
        });

        render();
      });

      function render() {
        renderCategories();
        renderProducts();
        renderCartCount();
      }
    </script>
  </body>
</html>
